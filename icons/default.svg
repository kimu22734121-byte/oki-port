<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a78"/><stop offset="1" stop-color="#5b2fb8"/>
    </linearGradient>
    <radialGradient id="hl" cx=".3" cy=".2" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="27" fill="url(#bg)"/>
  <rect width="120" height="120" rx="27" fill="url(#hl)"/>
  <rect x="1.5" y="1.5" width="117" height="117" rx="25.5" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5"/>
  <g fill="none" stroke="#b9a8ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="29" y="29" width="26" height="26" rx="7"/>
    <rect x="65" y="29" width="26" height="26" rx="7"/>
    <rect x="29" y="65" width="26" height="26" rx="7"/>
    <rect x="65" y="65" width="26" height="26" rx="7"/>
  </g>
</svg>

